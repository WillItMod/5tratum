# 5tratumOS Debian Installer preseed
#
# - Boots directly into Debian Installer (not a live session)
# - Auto-installs with minimal prompts
# - Uses Debian's standard partitioner confirmation step as the disk wipe confirmation
# - Installs 5tratumOS from an update bundle embedded on the ISO at:
#     /cdrom/5tratumos/5tratumos-update.tgz

d-i debian-installer/locale string en_GB.UTF-8
d-i keyboard-configuration/xkb-keymap select uk

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string 5tratumos
d-i netcfg/get_domain string local
d-i netcfg/get_nameservers string 1.1.1.1 8.8.8.8

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC

# Minimal, non-interactive user setup for the base OS (web UI handles first-run admin).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string 5tratumOS
d-i passwd/username string forge
d-i passwd/user-password password 5tratum
d-i passwd/user-password-again password 5tratum
d-i user-setup/allow-password-weak boolean true

# Partitioning:
# - If exactly 1 disk is detected, auto-select it.
# - If multiple disks are present, let Debian Installer prompt the user to choose.
d-i preseed/early_command string \
  DISKS="$(list-devices disk 2>/dev/null || true)"; \
  DISK_COUNT="$(printf '%s\n' "$DISKS" | sed '/^$/d' | wc -l | tr -d ' ')"; \
  if [ "$DISK_COUNT" = "1" ]; then \
    DISK="$(printf '%s\n' "$DISKS" | sed '/^$/d' | head -n 1)"; \
    debconf-set partman-auto/disk "$DISK" || true; \
    debconf-set grub-installer/bootdev "$DISK" || true; \
    debconf-set grub-pc/install_devices "$DISK" || true; \
  fi
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean false

tasksel tasksel/first multiselect standard
popularity-contest popularity-contest/participate boolean false

d-i pkgsel/include string ca-certificates curl gnupg jq python3 python3-yaml

grub-installer grub-installer/with_other_os boolean true
grub-installer grub-installer/only_debian boolean true
# Avoid the "Device for boot loader installation" prompt.
grub-installer grub-installer/bootdev string default
grub-pc grub-pc/install_devices multiselect default

finish-install finish-install/reboot_in_progress note

# Install 5tratumOS into the target.
d-i preseed/late_command string \
  cp -a /cdrom/5tratumos/5tratumos-update.tgz /target/root/5tratumos-update.tgz; \
  cp -a /cdrom/5tratumos/late_command.sh /target/root/late_command.sh; \
  chmod 0755 /target/root/late_command.sh; \
  in-target /bin/sh -c 'if /root/late_command.sh; then exit 0; else echo "--- late_command.log tail ---"; tail -n 200 /root/late_command.log 2>/dev/null || true; exit 1; fi'
