name: Build self-repair GHCR image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/self-repair/**"
      - "SELF_REPAIR.md"
      - ".github/workflows/self-repair-ghcr.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/willitmod/5tratumos-self-repair

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tools/self-repair
          file: tools/self-repair/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:v0.3.122
            ${{ env.IMAGE_NAME }}:latest
