      fill="url(#fire)"
      opacity="0.98"
    />
    <path
      d="M37.8 14.4c3.2 3.6 3.4 7.8 1.2 10.8-1.6 2.2-4 3.4-6.6 3.4-3.4 0-6.3-1.8-7.7-4.7 1.3 1.1 3.1 1.7 4.9 1.7 4.2 0 7.6-3.2 7.6-7.1 0-1.5-.5-2.9-.9-4.1Z"
      fill="url(#fire)"
      opacity="0.9"
    />

    <!-- Anvil -->
    <path
      d="M20 30c0-2.2 1.8-4 4-4h16c2.2 0 4 1.8 4 4v2h-6.4l-1.4 4.2H27.8L26.4 32H20v-2Zm4.5 10.2h15L41 45H23l1.5-4.8Zm-1 7.8h18c.8 0 1.5.7 1.5 1.5V53H22v-3.5c0-.8.7-1.5 1.5-1.5Z"
      fill="url(#g)"
      opacity="0.95"
    />

    <!-- Base highlight -->
    <path
      d="M19 53h26"
      stroke="rgba(255,255,255,0.22)"
      stroke-width="2"
      stroke-linecap="round"
    />
