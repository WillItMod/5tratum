<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ForgeOS">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff" />
      <stop offset="0.55" stop-color="#ff2bd6" />
      <stop offset="1" stop-color="#ff9a00" />
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed" />
      <stop offset="0.38" stop-color="#fde047" />
      <stop offset="1" stop-color="#fb7185" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b" />
      <feColorMatrix
        in="b"
        type="matrix"
        values="1 0 0 0 0  0 0.9 0 0 0  0 0 0.9 0 0  0 0 0 0.8 0"
        result="c"
      />
      <feMerge>
        <feMergeNode in="c" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
