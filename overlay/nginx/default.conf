map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

# Force external users onto HTTPS when HTTPS is enabled, but keep a localhost escape hatch
# (useful if SSL config breaks, so the console/SSH can still reach http://127.0.0.1/).
map $host $force_https_host {
  default 1;
  127.0.0.1 0;
  localhost 0;
}

# Redirect only when:
# - request is http
# - host is not localhost
# - HTTPS has been enabled (ssl.inc sets $https_enabled=1)
map "$scheme:$force_https_host:$https_enabled" $do_https_redirect {
  default 0;
  "http:1:1" 1;
}

server {
  listen 80 default_server;
  server_name _;

  # Optional HTTPS (self-signed) listener is injected via /etc/nginx/conf.d/ssl.inc.
  # IMPORTANT: this is not a *.conf file on purpose (nginx auto-loads conf.d/*.conf at the http{} level).
  include /etc/nginx/conf.d/ssl.inc;

  if ($do_https_redirect) {
    return 301 https://$host$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;

  auth_request /_auth;
  error_page 401 = @login;

  location = /_auth {
    internal;
    auth_request off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_pass http://127.0.0.1:9000/api/v0/auth/check;
  }

  location @login {
    auth_request off;
    return 302 /login.html?next=$request_uri;
  }

  location = /login {
    auth_request off;
    return 302 /login.html;
  }

  location = /login.html {
    auth_request off;
    try_files /login.html =404;
  }

  location = /axe.css {
    auth_request off;
  }

  location = /5tratumos.css {
    auth_request off;
  }

  location /assets/ {
    auth_request off;
  }

  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location /api/v0/auth/ {
    auth_request off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:9000;
  }

  location /api/v0/ {
    error_page 401 = @api_401;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_pass http://127.0.0.1:9000;
  }

  location @api_401 {
    auth_request off;
    add_header Content-Type application/json always;
    return 401 '{"ok":false,"error":"unauthorized"}';
  }

  location /store/ {
    alias /opt/5tratumos/store/;
    add_header Cache-Control "public, max-age=86400" always;
  }

  # App reverse-proxy routes are managed dynamically by 5tratumOS (system_proxy_repair).
}
