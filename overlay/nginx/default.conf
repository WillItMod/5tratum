map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;

  auth_request /_auth;
  error_page 401 = @login;

  location = /_auth {
    internal;
    auth_request off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_pass http://127.0.0.1:9000/api/v0/auth/check;
  }

  location @login {
    auth_request off;
    return 302 /login.html?next=$request_uri;
  }

  location = /login {
    auth_request off;
    return 302 /login.html;
  }

  location = /login.html {
    auth_request off;
    try_files /login.html =404;
  }

  location = /axe.css {
    auth_request off;
  }

  location = /forgeos.css {
    auth_request off;
  }

  location /assets/ {
    auth_request off;
  }

  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location /api/v0/auth/ {
    auth_request off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://127.0.0.1:9000;
  }

  location /api/v0/ {
    error_page 401 = @api_401;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://127.0.0.1:9000;
  }

  location @api_401 {
    auth_request off;
    add_header Content-Type application/json always;
    return 401 '{"ok":false,"error":"unauthorized"}';
  }

  location /store/ {
    alias /opt/forgeos/store/;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location = /apps/axelive {
    return 301 /apps/axelive/;
  }

	  location /apps/axelive/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_buffering on;
    proxy_buffer_size 1024k;
    proxy_buffers 32 1024k;
    proxy_busy_buffers_size 2048k;
    sendfile off;
	    proxy_set_header Accept-Encoding "";
	    sub_filter_once off;
	    sub_filter_types text/html text/css application/javascript text/javascript application/json application/manifest+json;
	    sub_filter '"/app.css' '"/apps/axelive/app.css';
	    sub_filter "'/app.css" "'/apps/axelive/app.css";
	    sub_filter '"/app.js' '"/apps/axelive/app.js';
	    sub_filter "'/app.js" "'/apps/axelive/app.js";
	    sub_filter '"/assets/' '"/apps/axelive/assets/';
	    sub_filter "'/assets/" "'/apps/axelive/assets/";
    sub_filter '"/api/' '"/apps/axelive/api/';
    sub_filter "'/api/" "'/apps/axelive/api/";
    sub_filter '"/api"' '"/apps/axelive/api"';
    sub_filter "'/api'" "'/apps/axelive/api'";
    sub_filter '`/api/' '`/apps/axelive/api/';
    sub_filter '`/api`' '`/apps/axelive/api`';
    sub_filter '"/icons/' '"/apps/axelive/icons/';
    sub_filter "'/icons/" "'/apps/axelive/icons/";
    sub_filter '"/manifest.webmanifest' '"/apps/axelive/manifest.webmanifest';
    sub_filter "'/manifest.webmanifest" "'/apps/axelive/manifest.webmanifest";
    sub_filter '"/sw.js' '"/apps/axelive/sw.js';
    sub_filter "'/sw.js" "'/apps/axelive/sw.js";
    proxy_pass http://127.0.0.1:5210/;
  }

