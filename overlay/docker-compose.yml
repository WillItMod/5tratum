services:
  portal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./portal:/usr/share/nginx/html:ro
      # Mount the whole nginx config directory (not individual files) so updates that
      # replace `default.conf` are always visible inside the container.
      - ./nginx:/etc/nginx/conf.d:ro
      - ./nginx/tls:/etc/nginx/tls:ro
      - /opt/5tratumos/store:/opt/5tratumos/store:ro
