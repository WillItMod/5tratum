services:
  portal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./portal:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Use a relative path so the portal can serve store assets regardless of the host install root.
      # (e.g. legacy installs may live under /opt/forgeos instead of /opt/5tratumos.)
      - ../store:/opt/5tratumos/store:ro
