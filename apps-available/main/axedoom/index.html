<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AxeDoom</title>
    <meta http-equiv="refresh" content="6" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #05060a;
        color: rgba(226, 232, 240, 0.9);
        display: grid;
        place-items: center;
      }
      .card {
        width: min(520px, calc(100vw - 40px));
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.35);
        padding: 18px 18px 16px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
      }
      .k {
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.9);
      }
      .v {
        margin-top: 8px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      a {
        color: rgba(0, 229, 255, 0.92);
      }
      .sub {
        margin-top: 10px;
        font-size: 12px;
        color: rgba(148, 163, 184, 0.9);
        line-height: 1.45;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="k">AxeDoom</div>
      <div class="v">Launching…</div>
      <div class="sub">
        If this doesn’t redirect, open:
        <a id="manual" href="#" class="mono">vnc_lite.html</a>
      </div>
    </div>
    <script>
      (function () {
        const baseDir = (function () {
          const p = String(window.location.pathname || '/');
          if (p.endsWith('/')) return p;
          const idx = p.lastIndexOf('/');
          return idx >= 0 ? p.slice(0, idx + 1) : '/';
        })();

        const prefix = baseDir === '/' ? '' : baseDir.replace(/^\//, '');
        const wsPath = `${prefix}websockify`;
        const target = `${baseDir}vnc_lite.html?scale=1&path=${encodeURIComponent(wsPath)}`;

        const a = document.getElementById('manual');
        if (a) a.setAttribute('href', target);

        window.setTimeout(() => {
          try {
            window.location.replace(target);
          } catch {
            window.location.href = target;
          }
        }, 120);
      })();
    </script>
  </body>
</html>
