services:
  init_permissions:
    image: busybox:1.36
    restart: "no"
    command:
      - sh
      - -c
      - >-
        chown -R 1000:1000 /data || true;
        touch /data/.permissions_ok
    volumes:
      - ${APP_DATA_DIR}/data:/data

  server:
    depends_on:
      - init_permissions
    image: ghcr.io/willitmod/axelive-release:v1.1-beta13@sha256:17f139115b51447b16ffe0ca218347264041ed0f351a71442eca8d3e2c2afab1
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    command:
      - sh
      - -c
      - >-
        while [ ! -f /data/.permissions_ok ]; do sleep 0.2; done;
        rm -f /data/instance.lock || true;
        exec /app/axelive.bin --replace-instance
    environment:
      AXELIVE_HOME: /data
      AXELIVE_PORT: 5210
      AXELIVE_HOST: 0.0.0.0
      AXELIVE_OPEN_UI: 0
    ports:
      - "5210:5210"
    volumes:
      - ${APP_DATA_DIR}/data:/data
