services:
  init_permissions:
    image: busybox:1.36
    restart: "no"
    command:
      - sh
      - -c
      - >-
        chown -R 1000:1000 /data || true;
        touch /data/.permissions_ok
    volumes:
      - ${APP_DATA_DIR}/data:/data

  server:
    depends_on:
      - init_permissions
    image: ghcr.io/willitmod/axebench-release:v3.0.1-alpha@sha256:3c0f2ffee49dbada14d313ef4fda12876b1f4fa85ef1b11283aad2692a52b979
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    command:
      - sh
      - -c
      - >-
        while [ ! -f /data/.permissions_ok ]; do sleep 0.2; done;
        exec /app/axebench.bin
    environment:
      AXE_HOST: 0.0.0.0
      AXE_PORT: 5000
      HOME: /data
    ports:
      - "5000:5000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
